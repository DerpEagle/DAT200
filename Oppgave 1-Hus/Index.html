<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hus</title>
</head>
<body>

    <canvas id="myCanvas" width="600" height="600" style="border:1px solid #d3d3d3;"></canvas>

<script type="text/javascript">
    let c = document.getElementById("myCanvas");
    let ctx = c.getContext("2d");

    // Himmel
    ctx.fillStyle = "#bfe3f5";
    ctx.fillRect(0, 0, 600, 600);

    // Sol
    ctx.fillStyle = "#ffd23f";
    ctx.beginPath();
    ctx.arc(530, 50, 40, 0, Math.PI * 2);
    ctx.fill();

    // Fjellinje
    ctx.strokeStyle = "#101011";
    ctx.lineWidth = 3;

    // Venstre fjell
    tegnFjelltopp(-100, 240, 170, 6, 490, 300, "#dde5e9", "#96a3ab");

    // Høyre fjell
    tegnFjelltopp(280, 220, 470, 80, 690, 230, "#c9b8a6", "#6b5342");

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;

    function tegnFjelltopp(xVenstre, yVenstre, xTopp, yTopp, xHoyre, yHoyre, toppFarge, bunnFarge) {
        let bunnY = Math.max(yVenstre, yHoyre);
        let gradient = ctx.createLinearGradient(xTopp, yTopp, xTopp, bunnY);
        gradient.addColorStop(0, toppFarge);
        gradient.addColorStop(1, bunnFarge);

        ctx.beginPath();
        ctx.moveTo(xVenstre, yVenstre);
        ctx.lineTo(xTopp, yTopp);
        ctx.lineTo(xHoyre, yHoyre);
        ctx.lineTo(xHoyre, 600);
        ctx.lineTo(xVenstre, 600);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.stroke();
    }

    // Bakke
    ctx.fillStyle = "#4caf50";
    ctx.fillRect(0, 500, 600, 100);

    // Sti til døren
    ctx.fillStyle = "#c2b280";
    ctx.beginPath();
    ctx.moveTo(250, 600);
    ctx.lineTo(262, 500);
    ctx.lineTo(337, 500);
    ctx.lineTo(350, 600);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Huskropp
    ctx.fillStyle = "#4a0715";
    ctx.strokeStyle = "#000000";
    ctx.fillRect(50, 250, 500, 250);
    ctx.strokeRect(50, 250, 500, 250);

    // Venstre vindu
    ctx.fillStyle = "#FFD872";
    ctx.fillRect(100, 300, 100, 100);
    ctx.strokeRect(100, 300, 100, 100);

    ctx.beginPath();
    ctx.moveTo(150, 300);
    ctx.lineTo(150, 400);
    ctx.moveTo(100, 350);
    ctx.lineTo(200, 350);
    ctx.stroke();

    // Høyre vindu
    ctx.fillRect(400, 300, 100, 100);
    ctx.strokeRect(400, 300, 100, 100);

    ctx.beginPath();
    ctx.moveTo(450, 300);
    ctx.lineTo(450, 400);
    ctx.moveTo(400, 350);
    ctx.lineTo(500, 350);
    ctx.stroke();

    // Dør
    ctx.fillStyle = "#8b4513";
    ctx.fillRect(262, 350, 75, 150);
    ctx.strokeRect(262, 350, 75, 150);

    // Dørhåndtak
    ctx.beginPath();
    ctx.arc(270, 425, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#B8860B";
    ctx.fill();
    ctx.stroke();

    // Tak
    ctx.fillStyle= "#78c1f2";
    ctx.beginPath();
    ctx.moveTo(35, 250);
    ctx.lineTo(300, 150);
    ctx.lineTo(565, 250);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Pipe
    ctx.fillStyle = "#5c250e";
    ctx.fillRect(420, 140, 40, 90);
    ctx.strokeRect(420, 140, 40, 90);

    // Røyk
    ctx.fillStyle = "#757070";
    tegnRoykRing(450, 130, 10);
    tegnRoykRing(430, 100, 15);
    tegnRoykRing(450, 55, 20);

    function tegnRoykRing(x, y, radius) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    // Busk venstre
    ctx.fillStyle = "#228B22";
    tegnBuskSirkel(90, 500, 35);
    tegnBuskSirkel(150, 500, 35);
    tegnBuskSirkel(120, 450, 35);

    // Busk høyre
    tegnBuskSirkel(510, 500, 35);
    tegnBuskSirkel(450, 500, 35);
    tegnBuskSirkel(480, 450, 35);

    function tegnBuskSirkel(x, y, radius) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    // Navn nederst til venstre
    ctx.fillStyle = "#000000";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText("Glenn Aleksandersen", 10, 575);
    ctx.font = "14px Arial";
    ctx.fillText("Student ved Universitetet i Agder", 10, 592);
</script>
</body>
</html>
